<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>

<h2>Register</h2>
<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="password" placeholder="Password"><br><br>
<button onclick="register()">Register</button>

<h2>Login</h2>
<input id="loginEmail" placeholder="Email"><br><br>
<input id="loginPassword" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<h3>Response:</h3>
<pre id="result"></pre>

<script>
async function register() {
  const res = await fetch("https://dharani-backend-204h.onrender.com/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}

async function login() {
  const res = await fetch("https://dharani-backend-204h.onrender.com/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    })
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
