```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dharani Admin Dashboard</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{

  width:260px;
  height:100vh;

  position:fixed;

  left:0;
  top:0;

  background:#0b0b0b;

  padding:30px;

  border-right:
  1px solid rgba(255,215,0,.1);

}

.sidebar h2{
  color:#ffd700;
  margin-bottom:40px;
  font-size:32px;
}

.sidebar a{

  display:block;

  margin-bottom:18px;

  padding:16px;

  background:#111;

  border-radius:16px;

  text-decoration:none;

  color:white;

  transition:.3s;

}

.sidebar a:hover{

  background:#ffd700;
  color:black;

}

/* MAIN */

.main-content{

  margin-left:260px;

  padding:40px;

  min-height:100vh;

}

/* HEADER */

.dashboard-title{
  font-size:52px;
  color:#ffd700;
  margin-bottom:35px;
}

/* STATS */

.stats-grid{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(250px,1fr));

  gap:25px;

  margin-bottom:50px;

}

.stat-card{

  background:#111;

  padding:35px;

  border-radius:28px;

  border:
  1px solid rgba(255,215,0,.12);

}

.stat-card h2{

  color:#ffd700;

  font-size:42px;

  margin-bottom:10px;

}

.stat-card p{
  color:#bbb;
}

/* UPLOAD */

.upload-box{

  background:#111;

  padding:35px;

  border-radius:28px;

  border:
  1px solid rgba(255,215,0,.12);

  margin-bottom:50px;

}

.upload-box h2{

  color:#ffd700;

  margin-bottom:25px;

}

.upload-form{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:20px;

}

.upload-form input,
.upload-form textarea{

  width:100%;

  padding:18px;

  border:none;

  border-radius:16px;

  background:#1a1a1a;

  color:white;

}

.upload-form textarea{
  grid-column:span 2;
}

.upload-form button{

  grid-column:span 2;

  padding:18px;

  border:none;

  border-radius:50px;

  background:
  linear-gradient(
  135deg,
  #d4af37,
  #ffd700);

  color:black;

  font-weight:700;

  cursor:pointer;

}

/* ENQUIRIES */

.enquiry-section h2{

  color:#ffd700;

  margin-bottom:30px;

  font-size:40px;

}

#enquiryContainer{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:25px;

}

.enquiry-card{

  background:#111;

  padding:25px;

  border-radius:24px;

  border:
  1px solid rgba(255,215,0,.12);

}

.enquiry-card h3{

  color:#ffd700;

  margin-bottom:15px;

  text-transform:capitalize;

}

.enquiry-card p{

  color:#ccc;

  line-height:1.8;

}

/* MOBILE */

@media(max-width:900px){

  .sidebar{

    position:relative;

    width:100%;

    height:auto;

  }

  .main-content{

    margin-left:0;

    width:100%;

  }

  .upload-form{

    grid-template-columns:1fr;

  }

  .upload-form textarea,
  .upload-form button{

    grid-column:span 1;

  }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h2>
    Dharani Admin
  </h2>

  <a href="#">
    Dashboard
  </a>

  <a href="#">
    Enquiries
  </a>

  <a href="#">
    Projects
  </a>

  <a href="#">
    Analytics
  </a>

</div>

<!-- MAIN -->

<div class="main-content">

  <h1 class="dashboard-title">
    Admin Dashboard
  </h1>

  <!-- STATS -->

  <div class="stats-grid">

    <div class="stat-card">

      <h2 id="projectCount">
        0
      </h2>

      <p>
        Total Projects
      </p>

    </div>

    <div class="stat-card">

      <h2 id="enquiryCount">
        0
      </h2>

      <p>
        Total Enquiries
      </p>

    </div>

  </div>

  <!-- UPLOAD -->

  <div class="upload-box">

    <h2>
      Upload New Project
    </h2>

    <form
    class="upload-form"
    id="projectForm">

      <input
      type="text"
      id="title"
      placeholder="Project Title"
      required>

      <input
      type="text"
      id="location"
      placeholder="Location"
      required>

      <textarea
      rows="6"
      id="description"
      placeholder="Project Description"></textarea>

      <input
      type="file"
      id="image">

      <button type="submit">

        Upload Project

      </button>

    </form>

  </div>

  <!-- ENQUIRIES -->

  <section class="enquiry-section">

    <h2>
      Recent Enquiries
    </h2>

    <div id="enquiryContainer">

      Loading enquiries...

    </div>

  </section>

</div>

<script>

/* LOAD ENQUIRIES */

async function loadEnquiries(){

  try{

    const res = await fetch(
      "http://localhost:5000/api/forms"
    );

    const data = await res.json();

    document.getElementById(
      "enquiryCount"
    ).innerText = data.length;

    const container =
    document.getElementById(
      "enquiryContainer"
    );

    container.innerHTML = "";

    data.reverse().forEach(item=>{

      container.innerHTML += `

      <div class="enquiry-card">

        <h3>
          ${item.type || "General"}
        </h3>

        <p>
          <b>Name:</b>
          ${item.name || "N/A"}
        </p>

        <p>
          <b>Email:</b>
          ${item.email || "N/A"}
        </p>

        <p>
          <b>Phone:</b>
          ${item.phone || "N/A"}
        </p>

        <p>
          <b>Message:</b>
          ${item.message || "N/A"}
        </p>

      </div>

      `;

    });

  }

  catch(err){

    console.log(err);

  }

}

loadEnquiries();

/* PROJECT UPLOAD */

document
.getElementById("projectForm")
.addEventListener("submit",
async(e)=>{

  e.preventDefault();

  alert(
    "Project Upload System Connected"
  );

  let count =
  document.getElementById(
    "projectCount"
  );

  count.innerText =
  Number(count.innerText)+1;

});

</script>

</body>
</html>
```
