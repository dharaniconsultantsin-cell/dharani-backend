<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Interior Design | Dharani Consultants</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  color:white;
}

/* NAVBAR */

header{
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  padding:22px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(14px);
}

.logo{
  color:#ffd700;
  font-size:30px;
  font-weight:700;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
}

nav a:hover{
  color:#ffd700;
}

/* HERO */

.hero{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
  linear-gradient(
  rgba(0,0,0,.7),
  rgba(0,0,0,.7)),
  url('assets/interior-bg.jpg');

  background-size:cover;
  background-position:center;
}

.hero-content h1{
  font-size:72px;
  color:#ffd700;
  margin-bottom:20px;
}

.hero-content p{
  color:#ccc;
  font-size:20px;
}

/* CONTENT */

.content{
  padding:120px 8%;
}

.content-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.content-card{
  background:#111;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,215,0,.12);
}

.content-card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.content-card div{
  padding:25px;
}

.content-card h3{
  color:#ffd700;
  margin-bottom:15px;
}

.content-card p{
  color:#bbb;
  line-height:1.8;
}

/* FORM */

.enquiry{
  padding:120px 8%;
  background:#080808;
}

.form-box{
  max-width:700px;
  margin:auto;
  background:#111;
  padding:45px;
  border-radius:30px;
}

.form-box h2{
  text-align:center;
  color:#ffd700;
  margin-bottom:35px;
}

.form-box input,
.form-box textarea{
  width:100%;
  padding:18px;
  background:#1a1a1a;
  border:none;
  border-radius:16px;
  color:white;
  margin-bottom:20px;
}

.form-box button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:50px;
  background:
  linear-gradient(135deg,#d4af37,#ffd700);

  color:black;
  font-weight:700;
  cursor:pointer;
}

/* FLOAT BUTTONS */

.float-buttons{
  position:fixed;
  right:25px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.float-buttons a{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  font-size:26px;
}

.whatsapp{
  background:#25D366;
  color:white;
}

.call{
  background:#ffd700;
  color:black;
}

</style>

</head>

<body>

<header>

  <div class="logo">
    Dharani Consultants
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="portfolio.html">
      Portfolio
    </a>

  </nav>

</header>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <h1>
      Interior Design
    </h1>

    <p>

      Premium luxury interiors crafted
      for elegant modern living.

    </p>

  </div>

</section>

<!-- CONTENT -->

<section class="content">

  <div class="content-grid">

    <div class="content-card">

      <img src="assets/interior1.jpg">

      <div>

        <h3>
          Modern Living Room
        </h3>

        <p>
          Elegant premium interiors with
          luxury modern aesthetics.
        </p>

      </div>

    </div>

    <div class="content-card">

      <img src="assets/interior2.jpg">

      <div>

        <h3>
          Luxury Bedroom
        </h3>

        <p>
          Premium comfort-focused interiors
          crafted with sophistication.
        </p>

      </div>

    </div>

  </div>

</section>

<!-- ENQUIRY -->

<section class="enquiry">

  <div class="form-box">

    <h2>
      Interior Enquiry
    </h2>

    <form id="interiorForm">

      <input
      type="text"
      id="name"
      placeholder="Your Name"
      required>

      <input
      type="email"
      id="email"
      placeholder="Email Address"
      required>

      <input
      type="text"
      id="phone"
      placeholder="Phone Number"
      required>

      <textarea
      rows="5"
      id="message"
      placeholder="Tell us about your interior project"></textarea>

      <button type="submit">

        Submit Enquiry

      </button>

    </form>

  </div>

</section>

<!-- FLOAT BUTTONS -->

<div class="float-buttons">

  <a
  href="https://wa.me/919986000149"
  class="whatsapp">

    ✆

  </a>

  <a
  href="tel:+919986000149"
  class="call">

    ☎

  </a>

</div>

<script>

document
.getElementById("interiorForm")
.addEventListener("submit",
async(e)=>{

  e.preventDefault();

  const data={

    type:"interior",

    name:
    document.getElementById("name").value,

    email:
    document.getElementById("email").value,

    phone:
    document.getElementById("phone").value,

    message:
    document.getElementById("message").value

  };

  const res = await fetch(
    "http://localhost:5000/api/forms/contact",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(data)
    }
  );

  if(res.ok){

    alert(
      "Enquiry Submitted Successfully"
    );

    document
    .getElementById("interiorForm")
    .reset();

  }

});

</script>

</body>
</html>
