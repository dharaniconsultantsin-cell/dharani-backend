<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dharani Portfolio</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  color:white;
}

/* NAVBAR */

header{
  position:fixed;
  width:100%;
  top:0;
  z-index:1000;
  padding:22px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
}

.logo{
  color:#ffd700;
  font-size:30px;
  font-weight:700;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  transition:.3s;
}

nav a:hover{
  color:#ffd700;
}

/* HERO */

.hero{
  height:60vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
  linear-gradient(
  rgba(0,0,0,.7),
  rgba(0,0,0,.7)),
  url('assets/portfolio-bg.jpg');

  background-size:cover;
  background-position:center;
}

.hero-content h1{
  font-size:72px;
  color:#ffd700;
  margin-bottom:20px;
}

.hero-content p{
  color:#ccc;
  font-size:20px;
}

/* PORTFOLIO */

.portfolio{
  padding:120px 8%;
}

.portfolio-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.portfolio-card{
  background:#111;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,215,0,.12);
  transition:.4s;
}

.portfolio-card:hover{
  transform:translateY(-8px);
  box-shadow:
  0 0 40px rgba(255,215,0,.12);
}

.portfolio-card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.portfolio-content{
  padding:25px;
}

.portfolio-content h3{
  color:#ffd700;
  margin-bottom:15px;
}

.portfolio-content p{
  color:#bbb;
  line-height:1.8;
}

/* FOOTER */

footer{
  background:black;
  padding:50px;
  text-align:center;
  border-top:
  1px solid rgba(255,215,0,.12);
}

footer h2{
  color:#ffd700;
  margin-bottom:15px;
}

footer p{
  color:#888;
}

/* MOBILE */

@media(max-width:900px){

  nav{
    display:none;
  }

  .hero-content h1{
    font-size:48px;
  }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<header>

  <div class="logo">
    Dharani Consultants
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="portfolio.html">
      Portfolio
    </a>

    

  </nav>

</header>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <h1>
      Our Portfolio
    </h1>

    <p>

      Premium projects crafted with
      elegance and precision.

    </p>

  </div>

</section>

<!-- PORTFOLIO -->

<section class="portfolio">

  <div
  class="portfolio-grid"
  id="portfolio-container">

  </div>

</section>

<!-- FOOTER -->

<footer>

  <h2>
    Dharani Consultants
  </h2>

  <p>
    Luxury Living Starts Here
  </p>

</footer>

<script>

async function loadPortfolio(){

  try{

    const res = await fetch(
      "http://localhost:5000/api/projects/all"
    );

    const data = await res.json();

    const container =
    document.getElementById(
      "portfolio-container"
    );

    container.innerHTML = "";

    data.reverse().forEach(project=>{

      container.innerHTML += `

        <div class="portfolio-card">

          <img
          src="http://localhost:5000/uploads/${project.image}">

          <div class="portfolio-content">

            <h3>${project.title}</h3>

            <p>${project.description}</p>

            <p>${project.location}</p>

          </div>

        </div>

      `;

    });

  }

  catch(err){

    console.log(err);

  }

}

loadPortfolio();

</script>

</body>
</html>
